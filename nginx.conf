server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # The site is built with trailingSlash: false and directory output, so a
    # request like /whoami must resolve to /whoami/index.html *without* issuing
    # a 301 redirect to /whoami/. Note we intentionally do not use `$uri/` so
    # nginx serves the index file directly instead of redirecting.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Astro emits a static 404 page.
    error_page 404 /404.html;

    # Fingerprinted build assets can be cached forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        application/rss+xml;
}
